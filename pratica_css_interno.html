<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula CSS - 1</title>
</head>

<style>
    .card {
        width: 500px;
        height: fit-content;
        background-color: aliceblue;
        border: solid 2px navy;
        margin: 20px;
        padding: 40px;
    }

    .border {
        border-radius: 20px;

    }

    .icone1 {
        width: 100px;
        height: 100px;
        background-image: url('https://cdn-icons-png.flaticon.com/512/706/706830.png');
        background-size: cover;
    }
    .icone2{
        width: 100px;
        height: 100px;
        background-image: url('https://cdn-icons-png.flaticon.com/256/3681/3681928.png');
        background-size: cover;

    }

    .title {
        font-size: 30px;
        margin-top: 20px;
        color: black;
    }

    .fonte {
        font-family: Arial, Helvetica, sans-serif;
    }

    .maincolor {
        color: navy;
    }
    p{
        font-size: 15px;
        font-style: italic;
    }
</style>

<body>

    <div class="card border">

        <div class="icone1 border"></div>


        <div>
            <h1 class="fonte title">
                Meu nome é: <span class="maincolor">Adriana</span>
            </h1>

            <p class="fonte">
                Mensagem: <span class="maincolor">A vida não é um morango! e ta tudo bem</span>
            </p>
        </div>
    </div>

    <div
        class="card border">

        <div style="width: 100px; height: 100px; border-radius: 25px;">
            <img style="width: 100%;  height: 100%; margin-top: 20px;"
                src="https://cdn-icons-png.flaticon.com/256/3681/3681928.png" alt="">
        </div>

        <div>
            <h1 style="font-family: monospace; font-size: 30px;">
                Meu nome é: Hugo
            </h1>

            <p style="font-family: monospace; font-size: 15px;">
                Mensagem: Um dia é da caça, o outro é do caçador.
            </p>
        </div>
    </div>

</body>

</html>
